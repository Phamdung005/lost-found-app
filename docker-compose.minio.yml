services:
  minio:
    image: minio/minio:latest
    container_name: findbox-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-findboxadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-findboxadmin123}
    volumes:
      - findbox_minio_data:/data

volumes:
  findbox_minio_data:
